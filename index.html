<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>trackmidolla</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
:root{--bg:#101310;--panel:#171b17;--line:#293329;--lime:#b7ff38;--muted:#70806b;--red:#ff6868}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--lime);font-family:'Share Tech Mono',monospace;min-height:100vh}
.app{max-width:760px;margin:auto;padding:28px 18px 90px}.brand{font-size:28px;letter-spacing:2px}.sub{color:var(--muted);font-size:12px;margin-top:4px}
.rule{border-top:1px solid var(--line);margin:22px 0}.total{font-size:48px;margin:8px 0 2px}.label{color:var(--muted);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0}.card{background:var(--panel);border:1px solid var(--line);padding:15px;border-radius:6px}.card b{display:block;font-size:19px;margin-top:8px}
button,input,select{font:inherit;color:var(--lime);background:#111511;border:1px solid #3c4d38;border-radius:5px;padding:13px}button{cursor:pointer}.primary{width:100%;font-size:16px;padding:15px;border-color:var(--lime);background:#182018}.tabs{display:flex;gap:8px;margin:18px 0}.tabs button{flex:1}.tabs .active{background:var(--lime);color:#101310}
.form{display:grid;gap:10px;background:var(--panel);padding:16px;border:1px solid var(--line);border-radius:6px;margin-top:14px}.form label{font-size:11px;color:var(--muted)}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.list{margin-top:18px}.tx{display:flex;justify-content:space-between;gap:12px;padding:14px 2px;border-bottom:1px solid var(--line)}.tx small{display:block;color:var(--muted);margin-top:5px}.amt{white-space:nowrap}.income{color:var(--lime)}.expense{color:var(--red)}
@media(max-width:560px){.grid{grid-template-columns:1fr}.total{font-size:40px}.row{grid-template-columns:1fr}}
</style>

<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#101310">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="trackmidolla">
<link rel="apple-touch-icon" href="icon.svg">
</head>
<body>
<div class="app">
  <div class="brand">trackmidolla</div>
  <div class="sub">PERSONAL FINANCE // GBP £</div>
  <div class="rule"></div>

  <div class="label">CURRENT BALANCE</div>
  <div class="total" id="balance">£0.00</div>

  <div class="grid">
    <div class="card"><span class="label">BUSINESS</span><b id="business">£0.00</b></div>
    <div class="card"><span class="label">PERSONAL</span><b id="personal">£0.00</b></div>
    <div class="card"><span class="label">EXPENSES</span><b id="expenses">£0.00</b></div>
  </div>

  <button class="primary" onclick="toggleForm()">+ ADD TRANSACTION</button>

  <div id="formWrap" style="display:none">
    <div class="form">
      <label>WHAT WAS IT?</label>
      <input id="desc" placeholder="e.g. Petrol, client payment..." autocomplete="off">
      <div class="row">
        <div><label>AMOUNT (£)</label><input id="amount" type="number" min="0" step="0.01" placeholder="0.00"></div>
        <div><label>DATE</label><input id="date" type="date"></div>
      </div>
      <div><label>TYPE</label>
        <select id="type">
          <option value="business">BUSINESS</option>
          <option value="personal">PERSONAL</option>
          <option value="expense">EXPENSE</option>
        </select>
      </div>
      <div class="row"><button onclick="addTx()">SAVE</button><button onclick="toggleForm()">CANCEL</button></div>
    </div>
  </div>

  <div class="tabs">
    <button class="active" data-filter="all">ALL</button>
    <button data-filter="business">BUSINESS</button>
    <button data-filter="personal">PERSONAL</button>
    <button data-filter="expense">EXPENSES</button>
  </div>
  <div class="list" id="list"></div>
</div>

<script>
const key='trackmidolla_transactions';
let txs=JSON.parse(localStorage.getItem(key)||'[]');
let filter='all';
const money=n=>new Intl.NumberFormat('en-GB',{style:'currency',currency:'GBP'}).format(n);
function save(){localStorage.setItem(key,JSON.stringify(txs));render()}
function render(){
  let business=txs.filter(x=>x.type==='business').reduce((a,x)=>a+x.amount,0);
  let personal=txs.filter(x=>x.type==='personal').reduce((a,x)=>a+x.amount,0);
  let expenses=txs.filter(x=>x.type==='expense').reduce((a,x)=>a+x.amount,0);
  document.querySelector('#business').textContent=money(business);
  document.querySelector('#personal').textContent=money(personal);
  document.querySelector('#expenses').textContent=money(expenses);
  document.querySelector('#balance').textContent=money(business+personal-expenses);
  const shown=txs.filter(x=>filter==='all'||x.type===filter).sort((a,b)=>b.date.localeCompare(a.date));
  document.querySelector('#list').innerHTML=shown.length?shown.map(x=>`
    <div class="tx"><div>${escapeHtml(x.desc)}<small>${x.date} // ${x.type.toUpperCase()}</small></div>
    <div class="amt ${x.type==='expense'?'expense':'income'}">${x.type==='expense'?'−':'+'}${money(x.amount).replace('£','£')}</div></div>`).join(''):'<div class="label">NO TRANSACTIONS YET.</div>';
}
function escapeHtml(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function toggleForm(){let w=document.querySelector('#formWrap');w.style.display=w.style.display==='none'?'block':'none';if(w.style.display==='block')document.querySelector('#date').value=new Date().toISOString().slice(0,10)}
function addTx(){
  const desc=document.querySelector('#desc').value.trim(), amount=Number(document.querySelector('#amount').value), date=document.querySelector('#date').value, type=document.querySelector('#type').value;
  if(!desc||!amount||!date)return alert('Please enter the description, amount and date.');
  txs.push({desc,amount,date,type});document.querySelector('#desc').value='';document.querySelector('#amount').value='';toggleForm();save();
}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.filter;render()});
render();
</script>
<script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");</script></body></html>
